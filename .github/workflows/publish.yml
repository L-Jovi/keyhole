name: Publish reviewed release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing reviewed version tag (must match package version)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: keyhole-publish
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - name: Verify reviewed main ancestry and tag/version match
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          git merge-base --is-ancestor HEAD origin/main
          test "$(git rev-parse HEAD)" = "$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")"
          uv run --no-project python -c 'import os, re; from pathlib import Path; v = re.search(r"__version__ = \"([^\"]+)\"", Path("src/keyhole/__init__.py").read_text())[1]; assert os.environ["RELEASE_TAG"] == "v" + v'
      - run: uv sync --locked --group dev
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run pytest -q
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: release-distributions
          path: dist/

  verify:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: release-distributions
          path: dist/
      - run: uv run --no-project python contrib/ci/check_artifacts.py

  verify-windows:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
      - uses: actions/download-artifact@v4
        with:
          name: release-distributions
          path: dist/
      - name: Install the release wheel with the docs/windows.md command and run it unconfigured
        shell: pwsh
        run: ./contrib/windows/check_documented_install.ps1 -Wheel (Get-ChildItem dist/*.whl).FullName

  pypi:
    needs: [verify, verify-windows]
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/keyhole-mcp/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  release-assets:
    needs: pypi
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-distributions
          path: dist/
      - name: Attach the same verified bytes to the existing GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          cd dist
          sha256sum *.whl *.tar.gz > SHA256SUMS.txt
          gh release view "$RELEASE_TAG"
          gh release upload "$RELEASE_TAG" ./*.whl ./*.tar.gz SHA256SUMS.txt
