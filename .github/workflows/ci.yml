name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-22.04, ubuntu-24.04]
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
      - run: uv run keyhole --help

  artifacts:
    name: Artifacts / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-22.04, ubuntu-24.04]
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
      - run: uv build
      - name: Test both artifacts and a fresh tool PATH
        run: uv run --no-project python contrib/ci/check_artifacts.py
      - name: Download and run the pinned official client without credentials
        run: uv run python contrib/ci/check_client_install.py

  glama-demo:
    name: Glama evaluation container
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - run: uv sync --locked --no-dev
      - run: docker build -f contrib/glama/Dockerfile -t keyhole-glama-test .
      - run: uv run --no-sync python contrib/glama/smoke_test.py --image keyhole-glama-test

  windows-cli:
    name: Windows unsupported-platform message
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run keyhole --help
      - run: uv run keyhole --version
      - name: Reject unsupported commands without a traceback
        run: uv run python -c "import json, subprocess; r = subprocess.run(['keyhole', 'status'], capture_output=True, text=True); assert r.returncode == 1; assert json.loads(r.stdout)['error']['code'] == 'unsupported_platform'; assert 'Traceback' not in r.stderr"

  windows-feasibility:
    name: Windows NTFS primitives / ${{ matrix.os }} (not platform support)
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, windows-11-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          architecture: x64
      - name: Install candidate dependencies
        run: python -m pip install .
      - name: Run the standalone probe as a standard user
        shell: pwsh
        run: ./contrib/windows/run-standard-user.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-feasibility-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/keyhole-windows/report.json
            ${{ runner.temp }}/keyhole-windows/native-*.txt
            ${{ runner.temp }}/keyhole-windows/integration-*.txt
            ${{ runner.temp }}/keyhole-windows/installer-*.txt
          if-no-files-found: warn
