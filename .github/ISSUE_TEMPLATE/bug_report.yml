name: Bug report
description: Something did not behave as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead. Include the error code; remove private paths and file contents before sharing other output.
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: Output of `keyhole status --redact`, OS/version and installation method. With v0.3.2 or older, manually remove tunnel ids, workspace names and private paths from status output. Never include keys or file contents.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I did not paste an API key, tunnel id or private file contents into this report.
          required: true
