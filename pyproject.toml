[project]
name = "keyhole-mcp"
dynamic = ["version"]
description = "Let ChatGPT read, and carefully edit, only the local folders you choose - through OpenAI's Secure MCP Tunnel, with no shell and no public port."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Jovi" }]
keywords = ["chatgpt", "mcp", "secure-mcp-tunnel", "local-files", "filesystem"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: Utilities",
]
dependencies = [
    "mcp>=2.2,<3",
    "openpyxl>=3.1",
    "pillow>=11",
    "pypdf>=6",
    "pypdfium2>=5",
    "python-docx>=1.2",
    "python-pptx>=1.0",
]

[project.scripts]
keyhole = "keyhole.cli:main"

[project.urls]
Homepage = "https://github.com/L-Jovi/keyhole"
Documentation = "https://github.com/L-Jovi/keyhole#readme"
Changelog = "https://github.com/L-Jovi/keyhole/blob/main/CHANGELOG.md"
Issues = "https://github.com/L-Jovi/keyhole/issues"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/keyhole/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/keyhole"]

[tool.hatch.build.targets.sdist]
include = [
    "src", "tests", "docs", "skills", "contrib", ".codex-plugin", "uv.lock", "glama.json",
    "README.md", "LICENSE", "CHANGELOG.md", "CONTRIBUTING.md", "SECURITY.md",
    "CODE_OF_CONDUCT.md", "AGENTS.md",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.16"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
